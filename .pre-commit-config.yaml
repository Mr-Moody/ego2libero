default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2000"]
  # ruff runs from the locked venv so hooks and `make lint` agree on the version.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      # Naming rules from CONTRIBUTING.md (stdlib only, no venv needed).
      - id: commit-msg-name
        name: commit message and branch name
        entry: python3 scripts/check_git_names.py commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
      - id: branch-name
        name: branch name
        entry: python3 scripts/check_git_names.py branch
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
