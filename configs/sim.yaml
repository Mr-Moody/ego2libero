# LIBERO simulator settings.
#
# LIBERO-Goal tasks (task_id | name):
#   0 open_the_middle_drawer_of_the_cabinet
#   1 put_the_bowl_on_the_stove
#   2 put_the_wine_bottle_on_top_of_the_cabinet
#   3 open_the_top_drawer_and_put_the_bowl_inside
#   4 put_the_bowl_on_top_of_the_cabinet
#   5 push_the_plate_to_the_front_of_the_stove
#   6 put_the_cream_cheese_in_the_bowl
#   7 turn_on_the_stove
#   8 put_the_bowl_on_the_plate             <- chosen: matches the bowl-onto-plate real demos
#   9 put_the_wine_bottle_on_the_rack

suite: libero_goal
task_id: 8
task_name: put_the_bowl_on_the_plate     # checked against the suite at env creation
camera_names: [agentview, robot0_eye_in_hand]
image_size: 256                          # square renders, as in the HuggingFaceVLA/libero data
control_freq: 20                         # Hz
max_steps: 300                           # episode limit (LIBERO-Goal evaluation default)
seed: 0

# Pose of the real table frame in the LIBERO world frame. Placeholder: set so the table board
# centre lands where the bowl/plate sit in the task's initial states.
T_sim_table: {xyz: [0.0, 0.0, 0.9], rotvec: [0.0, 0.0, 0.0]}

# Real object names (capture.yaml) -> LIBERO object names in this task.
object_map: {bowl: akita_black_bowl_1, plate: plate_1}

# Replay (`e2l sim replay`, `e2l generate run`).
transit_speed: 0.25                      # m/s, free-space moves into each segment's first pose
gripper_settle_steps: 10                 # steps held at each grasp / release so the fingers settle
max_steps_per_target: 3                  # tracking steps per target while the grip site lags
tracking_gain: 3.0                       # pose error -> action gain (OSC lags a single delta)
track_pos_tol: 0.005                     # m; a target further than this gets extra steps
track_rot_tol: 0.05                      # rad
# Grasp blend: the human approach is kept, but its end bends onto a pre-grasp above a top-down
# rim grasp at the human's angle around the rim, then descends straight onto it. Rim values
# from the scripted grasp (scripted.py).
rim_grasp: {akita_black_bowl_1: [0.05, 0.025]}   # radius, height in the object frame (m)
grasp_blend_s: 0.5                       # s, human approach -> pre-grasp
grasp_lift: 0.06                         # m; pre-grasp height above the grasp: clears the wall
grasp_descend_s: 0.4                     # s, straight down from the pre-grasp
approach_radius: 0.15                    # m; earlier approach is replaced by the transit
# Rim grasps on the bowl's side facing the wine bottle, rack and cabinet collide on the way in.
grasp_keepout: [-120.0, 80.0]            # deg, sim frame: centre, half width
# Carries: the demos barely lift the bowl over the flat real plate (1-3 cm after scaling); the
# sim plate has a rim. Lift straight up first, carry this much higher, ramp it out at set-down.
carry_lift: 0.04                         # m
carry_ramp_s: 0.5                        # s
# The demo path starts where the real bowl was relative to the plate; bend it to start where
# the sim bowl is, fading back onto the demo path by the set-down.
carry_warp: true
carry_regrip: true                       # re-measure the grasp before the set-down
# LIBERO's On() needs the bowl within 3 cm of the plate centre; the demos end within ~2 cm, so
# grip slip in the sim tips some out. Fade the set-down onto the centre.
place_xy: {plate_1: [0.0, 0.0]}
# The hand body hits the wooden cabinet when it sets the bowl down from that side of the plate;
# the bowl is round, so turn it on the way to set it down from elsewhere.
release_keepout: [-95.0, 65.0]           # deg, sim frame: centre, half width
