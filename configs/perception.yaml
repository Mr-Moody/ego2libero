# Phone video -> DemoTrajectory.

hand_model: models/hand_landmarker.task  # downloaded by `make models`
fps: 30.0                                # constant frame rate after normalisation
mirrored: false                          # true only for selfie / webcam feeds
hand: Right                              # MediaPipe handedness label of the demonstrating hand
num_hands: 2                             # detect both so the filter can reject the wrong one
min_detection_confidence: 0.5
min_tracking_confidence: 0.5
max_wrist_jump_px: 150.0                 # reject detections whose wrist jumps further per frame
max_gap_s: 0.2                           # fill interior tracking gaps up to this long (s)
smooth_accel_noise: 1.0                  # m^2/s^3, constant-velocity Kalman model
smooth_meas_std: 0.01                    # m, keypoint measurement noise
smooth: true                             # Kalman forward + RTS backward over keypoints
