# SmolVLA fine-tuning through `lerobot-train`.

policy_path: lerobot/smolvla_base            # not smolvla_libero: it already saw LIBERO demos
dataset_repo_id: local/ego2libero
dataset_root: data/lerobot/ego2libero        # written by `e2l train export`
output_dir: outputs/train/smolvla
steps: 20000
batch_size: 32
num_workers: 4
save_freq: 5000
wandb: false
# appended verbatim; add e.g. "--policy.device=cuda" on the command line with --set.
# smolvla_base expects observation.images.camera1..3; our dataset has image and image2.
extra_args:
  - '--rename_map={"observation.images.image": "observation.images.camera1", "observation.images.image2": "observation.images.camera2"}'
  - --policy.empty_cameras=1                 # camera3 is filled with an empty (masked) image
